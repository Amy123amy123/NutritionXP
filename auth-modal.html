<!-- Shared auth modal – included on every page -->
<div class="auth-overlay" id="authOverlay"></div>
<div class="auth-modal" id="authModal">
  <button class="auth-modal-close" onclick="closeAuthModal()" type="button">&times;</button>
  <h2 id="authModalTitle">Login</h2>
  <p class="auth-subtitle">Sign up or log in to add products to your cart</p>
  <div class="auth-error" id="authError"></div>
  <form id="loginForm" onsubmit="handleLoginSubmit(event)">
    <div class="auth-form-group">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required>
    </div>
    <div class="auth-form-group">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Your password" required>
    </div>
    <button type="submit" class="auth-submit-btn">Login</button>
    <p class="auth-switch">Don't have an account? <a onclick="switchAuthMode('signup')">Sign Up</a></p>
  </form>
  <form id="signupForm" style="display:none" onsubmit="handleSignupSubmit(event)">
    <div class="auth-form-row">
      <div class="auth-form-group">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="Jane Smith" required>
      </div>
      <div class="auth-form-group">
        <label for="signupPhone">Phone Number</label>
        <input type="tel" id="signupPhone" placeholder="9876543210" required>
      </div>
    </div>
    <div class="auth-form-group">
      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" required>
    </div>
    <div class="auth-form-group">
      <label for="signupAddress">Address</label>
      <input type="text" id="signupAddress" placeholder="Street, area, pin code" required>
    </div>
    <div class="auth-form-row">
      <div class="auth-form-group">
        <label for="signupCity">City</label>
        <input type="text" id="signupCity" placeholder="Mohali" required>
      </div>
      <div class="auth-form-group">
        <label for="signupCountry">Country</label>
        <input type="text" id="signupCountry" placeholder="India" required>
      </div>
    </div>
    <div class="auth-form-row">
      <div class="auth-form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Min. 6 characters" required minlength="6">
      </div>
      <div class="auth-form-group">
        <label for="signupConfirm">Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Confirm password" required>
      </div>
    </div>
    <button type="submit" class="auth-submit-btn">Create Account</button>
    <p class="auth-switch">Already have an account? <a onclick="switchAuthMode('login')">Login</a></p>
  </form>
</div>
